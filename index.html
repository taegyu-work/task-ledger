<style>
  :root {
    --bg: #f1efe9;
    --surface: #ffffff;
    --surface-2: #e9e5d9;
    --border: #dcd7c9;
    --border-strong: #c7c1af;
    --text: #221f1a;
    --text-muted: #6e6a5c;
    --text-faint: #948e7c;
    --accent: #2f6b5e;
    --accent-soft: #e2ede9;
    --accent-contrast: #ffffff;
    --danger: #ab4a3a;
    --danger-soft: #f4e5e1;
    --focus-ring: #2f6b5e;

    /* priority semantics — deliberately distinct from the teal brand accent */
    --pri-high: #ab4a3a;
    --pri-high-soft: #f4e5e1;
    --pri-med: #a8752a;
    --pri-med-soft: #f2e6d2;
    --pri-low: #4f7089;
    --pri-low-soft: #e4ebf0;
    --pri-none-text: var(--text-faint);
    --pri-none-border: var(--border-strong);

    --calendar-filter: none;

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1916;
      --surface: #242220;
      --surface-2: #2c2a25;
      --border: #3b382f;
      --border-strong: #4c483c;
      --text: #ece8de;
      --text-muted: #a39d8c;
      --text-faint: #7d7768;
      --accent: #72b69f;
      --accent-soft: #223330;
      --accent-contrast: #12211d;
      --danger: #dd8c7a;
      --danger-soft: #3a2620;
      --focus-ring: #72b69f;

      --pri-high: #e08a76;
      --pri-high-soft: #3a2620;
      --pri-med: #d1a355;
      --pri-med-soft: #362d1c;
      --pri-low: #8fb0c4;
      --pri-low-soft: #1f2c33;

      --calendar-filter: invert(0.85);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1a1916;
    --surface: #242220;
    --surface-2: #2c2a25;
    --border: #3b382f;
    --border-strong: #4c483c;
    --text: #ece8de;
    --text-muted: #a39d8c;
    --text-faint: #7d7768;
    --accent: #72b69f;
    --accent-soft: #223330;
    --accent-contrast: #12211d;
    --danger: #dd8c7a;
    --danger-soft: #3a2620;
    --focus-ring: #72b69f;

    --pri-high: #e08a76;
    --pri-high-soft: #3a2620;
    --pri-med: #d1a355;
    --pri-med-soft: #362d1c;
    --pri-low: #8fb0c4;
    --pri-low-soft: #1f2c33;

    --calendar-filter: invert(0.85);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  header.masthead { margin-bottom: 40px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-wrap: balance;
    color: var(--text);
  }

  .subtitle {
    margin: 0;
    color: var(--text-muted);
    font-size: 14.5px;
    max-width: 46ch;
  }

  .rule {
    border: none;
    border-top: 1px solid var(--border-strong);
    margin: 28px 0 0;
  }

  /* --- due-date reminders --- */

  .reminders { display: none; margin: 20px 0 4px; }
  .reminder-group + .reminder-group { margin-top: 14px; }

  .reminder-heading {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
  }

  .group-overdue .reminder-heading { color: var(--pri-high); }
  .group-today .reminder-heading { color: var(--pri-med); }

  .reminder-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .reminder-chip {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    padding: 6px 12px;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
    cursor: pointer;
    border: 1px solid;
    transition: opacity 0.12s ease;
  }

  .reminder-chip:hover { opacity: 0.8; }

  .group-overdue .reminder-chip { border-color: var(--pri-high); background: var(--pri-high-soft); color: var(--pri-high); }
  .group-today .reminder-chip { border-color: var(--pri-med); background: var(--pri-med-soft); color: var(--pri-med); }

  @keyframes flash-bg {
    0% { background: var(--accent-soft); }
    100% { background: transparent; }
  }

  li.item.flash { animation: flash-bg 1.2s ease; border-radius: 6px; }

  /* --- add form --- */

  form.add-form { margin: 28px 0 4px; }

  .add-row {
    display: flex;
    gap: 10px;
  }

  .add-row input[type="text"] {
    flex: 1;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .add-row input[type="text"]::placeholder { color: var(--text-faint); }

  .add-row input[type="text"]:focus-visible {
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .add-row > button.primary {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    color: var(--accent-contrast);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 0 20px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .add-row > button.primary:hover { opacity: 0.88; }

  .add-options {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }

  .add-options .field-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .segmented {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    overflow: hidden;
  }

  .segmented button {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    border: none;
    border-left: 1px solid var(--border-strong);
    padding: 6px 12px;
    cursor: pointer;
  }

  .segmented button:first-child { border-left: none; }

  .segmented button[data-active="true"][data-level="low"] { background: var(--pri-low-soft); color: var(--pri-low); }
  .segmented button[data-active="true"][data-level="med"] { background: var(--pri-med-soft); color: var(--pri-med); }
  .segmented button[data-active="true"][data-level="high"] { background: var(--pri-high-soft); color: var(--pri-high); }

  input[type="date"] {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 10px;
    outline: none;
  }

  input[type="date"]:focus-visible {
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: var(--calendar-filter);
    cursor: pointer;
  }

  .add-row > button.primary:focus-visible,
  .icon-btn:focus-visible,
  .segmented button:focus-visible,
  .priority-pill:focus-visible,
  .reminder-chip:focus-visible,
  input[type="checkbox"]:focus-visible,
  input[type="date"]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  /* --- list --- */

  ul.list {
    list-style: none;
    margin: 24px 0 0;
    padding: 0;
    border-top: 1px solid var(--border);
  }

  li.item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--border);
  }

  .checkbox-wrap {
    position: relative;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 1px;
  }

  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    margin: 0;
    border: 1.5px solid var(--border-strong);
    border-radius: 5px;
    background: var(--surface);
    cursor: pointer;
    display: grid;
    place-content: center;
    transition: background 0.12s ease, border-color 0.12s ease;
  }

  input[type="checkbox"]:hover { border-color: var(--accent); }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }

  input[type="checkbox"]::after {
    content: "";
    width: 10px;
    height: 10px;
    transform: scale(0);
    transition: transform 0.12s ease;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    background: var(--accent-contrast);
  }

  input[type="checkbox"]:checked::after { transform: scale(1); }

  .item-main { flex: 1; min-width: 0; }

  .item-text {
    display: block;
    font-size: 15px;
    color: var(--text);
    word-wrap: break-word;
    cursor: text;
    outline: none;
  }

  .item-text:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 3px;
    border-radius: 3px;
  }

  li.done .item-text {
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--border-strong);
  }

  .item-controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 7px;
  }

  .priority-pill {
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    border-radius: 20px;
    padding: 3px 10px;
    cursor: pointer;
    background: transparent;
    border: 1px dashed var(--pri-none-border);
    color: var(--pri-none-text);
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }

  .priority-pill[data-level="low"] { border: 1px solid var(--pri-low); background: var(--pri-low-soft); color: var(--pri-low); }
  .priority-pill[data-level="med"] { border: 1px solid var(--pri-med); background: var(--pri-med-soft); color: var(--pri-med); }
  .priority-pill[data-level="high"] { border: 1px solid var(--pri-high); background: var(--pri-high-soft); color: var(--pri-high); }

  .due-input.urgency-overdue { color: var(--pri-high); border-color: var(--pri-high); }
  .due-input.urgency-today { color: var(--pri-med); border-color: var(--pri-med); }

  li.done .due-input,
  li.done .priority-pill { opacity: 0.55; }

  .icon-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: grid;
    place-content: center;
    background: transparent;
    border: none;
    border-radius: 5px;
    color: var(--text-faint);
    cursor: pointer;
    margin-left: auto;
    opacity: 0;
    transition: opacity 0.12s ease, color 0.12s ease, background 0.12s ease;
  }

  li.item:hover .icon-btn,
  li.item:focus-within .icon-btn { opacity: 1; }

  .icon-btn:hover { color: var(--danger); background: var(--danger-soft); }

  .empty-state {
    padding: 48px 4px;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
  }

  .empty-state .glyph {
    font-family: var(--font-display);
    font-size: 28px;
    color: var(--border-strong);
    margin-bottom: 10px;
    display: block;
  }

  footer.status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    padding-top: 4px;
  }

  .count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .count strong { color: var(--text); font-weight: 600; }

  .clear-btn {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 2px;
    text-decoration: underline;
    text-decoration-color: var(--border-strong);
    text-underline-offset: 3px;
  }

  .clear-btn:hover { color: var(--danger); text-decoration-color: var(--danger); }
  .clear-btn:disabled { color: var(--text-faint); text-decoration-color: transparent; cursor: default; }

  /* --- device sync --- */

  .sync-panel {
    margin: 20px 0 0;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }

  .sync-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border-strong);
    flex-shrink: 0;
  }

  .sync-dot.on { background: var(--accent); }

  .sync-label {
    font-size: 13px;
    color: var(--text-muted);
  }

  .sync-code-chip {
    font-family: var(--font-mono);
    font-size: 12.5px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 6px;
    padding: 3px 8px;
    letter-spacing: 0.02em;
  }

  .sync-link-btn {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px;
    text-decoration: underline;
    text-decoration-color: var(--border-strong);
    text-underline-offset: 3px;
  }

  .sync-link-btn:hover { text-decoration-color: var(--accent); }
  .sync-link-btn.danger:hover { color: var(--danger); text-decoration-color: var(--danger); }

  .sync-form-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .sync-form-row input[type="text"] {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 10px;
    outline: none;
  }

  .sync-form-row input[type="text"]:focus-visible {
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .sync-form-row button.primary-sm {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    color: var(--accent-contrast);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 0 14px;
    cursor: pointer;
  }

  .sync-link-btn:focus-visible,
  .sync-form-row input[type="text"]:focus-visible,
  .sync-form-row button.primary-sm:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  var firebaseConfig = {
    apiKey: "AIzaSyBiXxvokOsMHgQ25bAkELRrtYemGHSijks",
    authDomain: "task-ledger-9e9fc.firebaseapp.com",
    databaseURL: "https://task-ledger-9e9fc-default-rtdb.firebaseio.com",
    projectId: "task-ledger-9e9fc",
    storageBucket: "task-ledger-9e9fc.firebasestorage.app",
    messagingSenderId: "864864528629",
    appId: "1:864864528629:web:7c9f2d19919ad31a1d3dbc"
  };

  var fbApp = initializeApp(firebaseConfig);
  var db = getDatabase(fbApp);
  var currentUnsub = null;

  window.__sync = {
    watch: function (code, onData) {
      // stored as a JSON string, not a raw array/object — RTDB silently drops
      // empty arrays/objects, which would make a cleared list look "never created"
      // and get wrongly re-seeded from stale local data on the other device.
      if (currentUnsub) { currentUnsub(); currentUnsub = null; }
      var itemsRef = ref(db, "lists/" + code + "/items");
      currentUnsub = onValue(itemsRef, function (snapshot) {
        var raw = snapshot.val();
        if (raw === null || raw === undefined) { onData(null); return; }
        try { onData(JSON.parse(raw)); } catch (e) { onData(null); }
      }, function (err) {
        console.error("sync watch error", err);
      });
    },
    push: function (code, items) {
      if (!code) return;
      set(ref(db, "lists/" + code + "/items"), JSON.stringify(items)).catch(function (err) {
        console.error("sync push error", err);
      });
    },
    stop: function () {
      if (currentUnsub) { currentUnsub(); currentUnsub = null; }
    }
  };

  window.dispatchEvent(new Event("sync-ready"));
</script>

<script>
(function () {
  var STORAGE_KEY = "task-ledger.items.v2";
  var listEl = document.getElementById("list");
  var formEl = document.getElementById("add-form");
  var inputEl = document.getElementById("add-input");
  var dueEl = document.getElementById("add-due");
  var pickerEl = document.getElementById("priority-picker");
  var countEl = document.getElementById("count");
  var clearBtn = document.getElementById("clear-done");
  var remindersEl = document.getElementById("reminders");
  var archivePanelEl = document.getElementById("archive-panel");
  var archiveListEl = document.getElementById("archive-list");
  var archiveToggleBtn = document.getElementById("archive-toggle-btn");
  var exportBtn = document.getElementById("export-btn");
  var importBtn = document.getElementById("import-btn");
  var importFileEl = document.getElementById("import-file");
  var toastEl = document.getElementById("toast");
  var toastMessageEl = document.getElementById("toast-message");
  var toastUndoBtn = document.getElementById("toast-undo-btn");
  var archiveOpen = false;
  var toastTimer = null;

  function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function showUndoToast(message, undoFn) {
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    toastMessageEl.textContent = message;
    toastEl.classList.add("show");
    var handler = function () {
      undoFn();
      hideToast();
    };
    toastUndoBtn.onclick = handler;
    toastTimer = setTimeout(hideToast, 6000);
  }

  function hideToast() {
    toastEl.classList.remove("show");
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var PRIORITY_LABEL = { low: "Low", med: "Med", high: "High" };
  var PRIORITY_CYCLE = [null, "low", "med", "high"];

  var pendingPriority = null;

  function loadItems() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return migrateOld();
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function migrateOld() {
    // carry over items from the pre-priority/due-date version, if present
    try {
      var raw = localStorage.getItem("task-ledger.items.v1");
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.map(function (it) {
        return { text: it.text, done: !!it.done, createdAt: it.createdAt || Date.now(), priority: null, dueDate: null };
      });
    } catch (e) {
      return [];
    }
  }

  var SYNC_CODE_KEY = "task-ledger.sync-code";
  var syncCode = null;
  try { syncCode = localStorage.getItem(SYNC_CODE_KEY) || null; } catch (e) {}
  var syncPanelEl = document.getElementById("sync-panel");
  var syncFormOpen = false;
  var suppressNextPush = false;

  function saveItems(items) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) { /* storage unavailable */ }
    if (syncCode && window.__sync && !suppressNextPush) {
      window.__sync.push(syncCode, items);
    }
    suppressNextPush = false;
  }

  function normalizeItems(arr) {
    arr.forEach(function (it) {
      if (!it.id) it.id = makeId();
      if (it.priority === undefined) it.priority = null;
      if (it.dueDate === undefined) it.dueDate = null;
      if (it.done === undefined) it.done = false;
      if (it.archived === undefined) it.archived = false;
    });
    return arr;
  }

  var items = normalizeItems(loadItems());

  function makeSyncCode() {
    return (Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6)).slice(0, 18);
  }

  function handleRemoteUpdate(remoteItems) {
    if (remoteItems === null || remoteItems === undefined) {
      // brand-new / empty shared list — seed it with what's already on this device
      if (window.__sync) window.__sync.push(syncCode, items);
      return;
    }
    var arr = Array.isArray(remoteItems) ? remoteItems.filter(function (x) { return x; }) :
      Object.keys(remoteItems).map(function (k) { return remoteItems[k]; });
    items = normalizeItems(arr);
    suppressNextPush = true;
    saveItems(items);
    render();
  }

  function connectSync(code) {
    syncCode = code;
    try { localStorage.setItem(SYNC_CODE_KEY, code); } catch (e) {}
    if (window.__sync) window.__sync.watch(code, handleRemoteUpdate);
    syncFormOpen = false;
    renderSyncPanel();
  }

  function disconnectSync() {
    syncCode = null;
    try { localStorage.removeItem(SYNC_CODE_KEY); } catch (e) {}
    if (window.__sync) window.__sync.stop();
    renderSyncPanel();
  }

  function renderSyncPanel() {
    var eyebrowEl = document.getElementById("eyebrow");
    if (eyebrowEl) eyebrowEl.textContent = syncCode ? "Personal · Synced across your devices" : "Personal · Private to this browser";
    if (!syncPanelEl) return;
    var html;
    if (syncCode) {
      html =
        '<div class="sync-row">' +
          '<span class="sync-dot on"></span>' +
          '<span class="sync-label">Synced across devices</span>' +
          '<span class="sync-code-chip">' + escapeHtml(syncCode) + '</span>' +
          '<button type="button" class="sync-link-btn" id="sync-copy-btn">Copy code</button>' +
          '<button type="button" class="sync-link-btn danger" id="sync-stop-btn">Stop syncing</button>' +
        '</div>';
    } else if (syncFormOpen) {
      html =
        '<div class="sync-row">' +
          '<span class="sync-dot"></span>' +
          '<span class="sync-label">Not synced &mdash; this device only</span>' +
        '</div>' +
        '<div class="sync-form-row">' +
          '<input type="text" id="sync-code-input" placeholder="Paste a sync code" maxlength="24" aria-label="Sync code">' +
          '<button type="button" class="primary-sm" id="sync-connect-btn">Connect</button>' +
        '</div>' +
        '<p style="margin:8px 0 0;"><button type="button" class="sync-link-btn" id="sync-new-btn">or create a new sync code</button></p>';
    } else {
      html =
        '<div class="sync-row">' +
          '<span class="sync-dot"></span>' +
          '<span class="sync-label">Not synced &mdash; this device only</span>' +
          '<button type="button" class="sync-link-btn" id="sync-open-btn">Set up sync</button>' +
        '</div>';
    }
    syncPanelEl.innerHTML = html;

    var openBtn = document.getElementById("sync-open-btn");
    if (openBtn) openBtn.addEventListener("click", function () { syncFormOpen = true; renderSyncPanel(); });

    var newBtn = document.getElementById("sync-new-btn");
    if (newBtn) newBtn.addEventListener("click", function () { connectSync(makeSyncCode()); });

    var connectBtn = document.getElementById("sync-connect-btn");
    var codeInput = document.getElementById("sync-code-input");
    if (connectBtn && codeInput) {
      connectBtn.addEventListener("click", function () {
        var val = codeInput.value.trim();
        if (!val) return;
        connectSync(val);
      });
      codeInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); connectBtn.click(); }
      });
    }

    var copyBtn = document.getElementById("sync-copy-btn");
    if (copyBtn) copyBtn.addEventListener("click", function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(syncCode).then(function () {
          copyBtn.textContent = "Copied!";
          setTimeout(function () { copyBtn.textContent = "Copy code"; }, 1500);
        }).catch(function () {});
      }
    });

    var stopBtn = document.getElementById("sync-stop-btn");
    if (stopBtn) stopBtn.addEventListener("click", function () { disconnectSync(); });
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function fmtDue(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function urgency(dateStr, done) {
    if (!dateStr || done) return "none";
    var today = todayStr();
    if (dateStr < today) return "overdue";
    if (dateStr === today) return "today";
    return "upcoming";
  }

  var PRIORITY_RANK = { high: 3, med: 2, low: 1 };

  function compareItems(a, b) {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1; // open tasks first
    if (a.dueDate !== b.dueDate) {
      if (!a.dueDate) return 1;   // undated sorts after dated
      if (!b.dueDate) return -1;
      return a.dueDate < b.dueDate ? -1 : 1; // soonest first
    }
    var ar = PRIORITY_RANK[a.priority] || 0;
    var br = PRIORITY_RANK[b.priority] || 0;
    return br - ar; // high priority first among same-due items
  }

  function setPickerState(level) {
    pendingPriority = level;
    var buttons = pickerEl.querySelectorAll("button");
    buttons.forEach(function (b) {
      b.setAttribute("data-active", b.getAttribute("data-level") === level ? "true" : "false");
    });
  }

  pickerEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var level = btn.getAttribute("data-level");
    setPickerState(pendingPriority === level ? null : level);
  });

  function renderReminders() {
    var today = todayStr();
    var overdue = items.filter(function (it) { return !it.done && it.dueDate && it.dueDate < today; });
    var dueToday = items.filter(function (it) { return !it.done && it.dueDate === today; });

    if (overdue.length === 0 && dueToday.length === 0) {
      remindersEl.innerHTML = "";
      remindersEl.style.display = "none";
      return;
    }

    function chip(it) {
      return '<button type="button" class="reminder-chip" data-target="task-' + it.id + '">' + escapeHtml(it.text) + "</button>";
    }

    function group(cls, suffix, list) {
      if (list.length === 0) return "";
      var noun = list.length === 1 ? "task" : "tasks";
      return '<div class="reminder-group ' + cls + '"><p class="reminder-heading">' + list.length + " " + noun + " " + suffix +
        '</p><div class="reminder-items">' + list.map(chip).join("") + "</div></div>";
    }

    remindersEl.innerHTML = group("group-overdue", "overdue", overdue) + group("group-today", "due today", dueToday);
    remindersEl.style.display = "";

    remindersEl.querySelectorAll(".reminder-chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var target = document.getElementById(btn.getAttribute("data-target"));
        if (!target) return;
        var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
        target.classList.add("flash");
        setTimeout(function () { target.classList.remove("flash"); }, 1200);
      });
    });
  }

  function render() {
    renderReminders();
    renderArchivePanel();
    listEl.innerHTML = "";

    var visible = items.filter(function (it) { return !it.archived; });

    if (visible.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty-state";
      empty.innerHTML = '<span class="glyph">&#9634;</span>Nothing on the ledger yet.';
      listEl.appendChild(empty);
    } else {
      visible.slice().sort(compareItems).forEach(function (item) {
        var li = document.createElement("li");
        li.id = "task-" + item.id;
        li.className = "item" + (item.done ? " done" : "");

        var wrap = document.createElement("span");
        wrap.className = "checkbox-wrap";
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!item.done;
        cb.setAttribute("aria-label", item.done ? "Mark as not done" : "Mark as done");
        cb.addEventListener("change", function () {
          item.done = cb.checked;
          saveItems(items);
          render();
        });
        wrap.appendChild(cb);

        var main = document.createElement("div");
        main.className = "item-main";

        var text = document.createElement("span");
        text.className = "item-text";
        text.textContent = item.text;
        text.contentEditable = "true";
        text.spellcheck = false;
        text.addEventListener("blur", function () {
          var val = text.textContent.replace(/\s+/g, " ").trim();
          if (val === "") {
            items = items.filter(function (it) { return it !== item; });
            saveItems(items);
            render();
            return;
          }
          item.text = val;
          saveItems(items);
        });
        text.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); text.blur(); }
        });

        var controls = document.createElement("div");
        controls.className = "item-controls";

        var pri = document.createElement("button");
        pri.type = "button";
        pri.className = "priority-pill";
        if (item.priority) pri.setAttribute("data-level", item.priority);
        pri.textContent = item.priority ? PRIORITY_LABEL[item.priority] : "+ priority";
        pri.setAttribute("aria-label", "Priority: " + (item.priority ? PRIORITY_LABEL[item.priority] : "none") + ". Click to change.");
        pri.addEventListener("click", function () {
          var idx = PRIORITY_CYCLE.indexOf(item.priority || null);
          item.priority = PRIORITY_CYCLE[(idx + 1) % PRIORITY_CYCLE.length];
          saveItems(items);
          render();
        });

        var due = document.createElement("input");
        due.type = "date";
        due.className = "due-input";
        due.value = item.dueDate || "";
        due.setAttribute("aria-label", "Due date");
        var u = urgency(item.dueDate, item.done);
        if (u === "overdue") due.classList.add("urgency-overdue");
        if (u === "today") due.classList.add("urgency-today");
        due.addEventListener("change", function () {
          item.dueDate = due.value || null;
          saveItems(items);
          render();
        });

        var del = document.createElement("button");
        del.type = "button";
        del.className = "icon-btn";
        del.setAttribute("aria-label", "Delete task");
        del.innerHTML = "&#10005;";
        del.addEventListener("click", function () {
          item.archived = true;
          saveItems(items);
          render();
          showUndoToast("Task deleted", function () {
            item.archived = false;
            saveItems(items);
            render();
          });
        });

        controls.appendChild(pri);
        controls.appendChild(due);
        controls.appendChild(del);

        main.appendChild(text);
        main.appendChild(controls);

        li.appendChild(wrap);
        li.appendChild(main);
        listEl.appendChild(li);
      });
    }

    var remaining = visible.filter(function (it) { return !it.done; }).length;
    var doneCount = visible.length - remaining;
    countEl.innerHTML = visible.length === 0 ? "" : "<strong>" + remaining + "</strong> open &middot; " + doneCount + " done";
    clearBtn.disabled = doneCount === 0;
  }

  function restoreItem(item) {
    item.archived = false;
    saveItems(items);
    render();
  }

  function deleteForever(item) {
    items = items.filter(function (it) { return it !== item; });
    saveItems(items);
    render();
  }

  function renderArchivePanel() {
    var archived = items.filter(function (it) { return it.archived; });
    archiveToggleBtn.textContent = archiveOpen ? "Hide archive" : "View archive" + (archived.length ? " (" + archived.length + ")" : "");
    archivePanelEl.classList.toggle("open", archiveOpen);
    if (!archiveOpen) return;

    if (archived.length === 0) {
      archiveListEl.innerHTML = '<p class="archive-empty">Nothing archived yet — deleted and cleared tasks land here.</p>';
      return;
    }

    archiveListEl.innerHTML = "";
    archived.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }).forEach(function (item) {
      var row = document.createElement("div");
      row.className = "archive-item";

      var text = document.createElement("span");
      text.className = "archive-item-text";
      text.textContent = item.text;

      var restoreBtn = document.createElement("button");
      restoreBtn.type = "button";
      restoreBtn.className = "archive-restore-btn";
      restoreBtn.textContent = "Restore";
      restoreBtn.addEventListener("click", function () { restoreItem(item); });

      var deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "archive-delete-btn";
      deleteBtn.textContent = "Delete forever";
      deleteBtn.addEventListener("click", function () { deleteForever(item); });

      row.appendChild(text);
      row.appendChild(restoreBtn);
      row.appendChild(deleteBtn);
      archiveListEl.appendChild(row);
    });
  }

  archiveToggleBtn.addEventListener("click", function () {
    archiveOpen = !archiveOpen;
    renderArchivePanel();
  });

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    var val = inputEl.value.replace(/\s+/g, " ").trim();
    if (val === "") return;
    items.push({
      id: makeId(),
      text: val,
      done: false,
      createdAt: Date.now(),
      priority: pendingPriority,
      dueDate: dueEl.value || null
    });
    saveItems(items);
    inputEl.value = "";
    dueEl.value = "";
    setPickerState(null);
    inputEl.focus();
    render();
  });

  clearBtn.addEventListener("click", function () {
    var justArchived = items.filter(function (it) { return !it.archived && it.done; });
    if (justArchived.length === 0) return;
    justArchived.forEach(function (it) { it.archived = true; });
    saveItems(items);
    render();
    var n = justArchived.length;
    showUndoToast(n + (n === 1 ? " task" : " tasks") + " archived", function () {
      justArchived.forEach(function (it) { it.archived = false; });
      saveItems(items);
      render();
    });
  });

  renderSyncPanel();

  function startSyncIfSaved() {
    if (syncCode && window.__sync) window.__sync.watch(syncCode, handleRemoteUpdate);
  }
  window.addEventListener("sync-ready", startSyncIfSaved);
  if (window.__sync) startSyncIfSaved(); // in case the module script already finished

  exportBtn.addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "task-ledger-backup-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  importBtn.addEventListener("click", function () { importFileEl.click(); });

  importFileEl.addEventListener("change", function () {
    var file = importFileEl.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var imported;
      try { imported = JSON.parse(reader.result); } catch (e) {
        alert("That file isn't valid JSON — couldn't import it.");
        importFileEl.value = "";
        return;
      }
      if (!Array.isArray(imported)) {
        alert("That file doesn't look like a Task Ledger backup.");
        importFileEl.value = "";
        return;
      }
      var existingIds = {};
      items.forEach(function (it) { existingIds[it.id] = true; });
      var addedItems = [];
      imported.forEach(function (it) {
        if (it && typeof it.text === "string" && it.id && !existingIds[it.id]) {
          items.push(it);
          existingIds[it.id] = true;
          addedItems.push(it);
        }
      });
      importFileEl.value = "";
      if (addedItems.length === 0) {
        alert("Nothing new to import — every task in that file is already here.");
        return;
      }
      items = normalizeItems(items);
      saveItems(items);
      render();
      var n = addedItems.length;
      showUndoToast(n + (n === 1 ? " task" : " tasks") + " imported", function () {
        items = items.filter(function (it) { return addedItems.indexOf(it) === -1; });
        saveItems(items);
        render();
      });
    };
    reader.readAsText(file);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "n" || e.metaKey || e.ctrlKey || e.altKey) return;
    var active = document.activeElement;
    var tag = active && active.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (active && active.isContentEditable)) return;
    e.preventDefault();
    inputEl.focus();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (e) { console.error("SW registration failed", e); });
    });
  }

  render();
})();
</script>
