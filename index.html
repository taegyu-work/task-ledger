<style>
  :root {
    --bg: #f1efe9;
    --surface: #ffffff;
    --surface-2: #e9e5d9;
    --border: #dcd7c9;
    --border-strong: #c7c1af;
    --text: #221f1a;
    --text-muted: #6e6a5c;
    --text-faint: #948e7c;
    --accent: #2f6b5e;
    --accent-soft: #e2ede9;
    --accent-contrast: #ffffff;
    --danger: #ab4a3a;
    --danger-soft: #f4e5e1;
    --focus-ring: #2f6b5e;

    /* priority semantics — deliberately distinct from the teal brand accent */
    --pri-high: #ab4a3a;
    --pri-high-soft: #f4e5e1;
    --pri-med: #a8752a;
    --pri-med-soft: #f2e6d2;
    --pri-low: #4f7089;
    --pri-low-soft: #e4ebf0;
    --pri-none-text: var(--text-faint);
    --pri-none-border: var(--border-strong);

    /* tag semantics — categorization, distinct from both accent and priority hues */
    --tag: #7a5c99;
    --tag-soft: #ece5f2;

    --calendar-filter: none;

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1916;
      --surface: #242220;
      --surface-2: #2c2a25;
      --border: #3b382f;
      --border-strong: #4c483c;
      --text: #ece8de;
      --text-muted: #a39d8c;
      --text-faint: #7d7768;
      --accent: #72b69f;
      --accent-soft: #223330;
      --accent-contrast: #12211d;
      --danger: #dd8c7a;
      --danger-soft: #3a2620;
      --focus-ring: #72b69f;

      --pri-high: #e08a76;
      --pri-high-soft: #3a2620;
      --pri-med: #d1a355;
      --pri-med-soft: #362d1c;
      --pri-low: #8fb0c4;
      --pri-low-soft: #1f2c33;

      --tag: #c3a9e0;
      --tag-soft: #2e2638;

      --calendar-filter: invert(0.85);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1a1916;
    --surface: #242220;
    --surface-2: #2c2a25;
    --border: #3b382f;
    --border-strong: #4c483c;
    --text: #ece8de;
    --text-muted: #a39d8c;
    --text-faint: #7d7768;
    --accent: #72b69f;
    --accent-soft: #223330;
    --accent-contrast: #12211d;
    --danger: #dd8c7a;
    --danger-soft: #3a2620;
    --focus-ring: #72b69f;

    --pri-high: #e08a76;
    --pri-high-soft: #3a2620;
    --pri-med: #d1a355;
    --pri-med-soft: #362d1c;
    --pri-low: #8fb0c4;
    --pri-low-soft: #1f2c33;

    --tag: #c3a9e0;
    --tag-soft: #2e2638;

    --calendar-filter: invert(0.85);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  header.masthead { margin-bottom: 40px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-wrap: balance;
    color: var(--text);
  }

  .subtitle {
    margin: 0;
    color: var(--text-muted);
    font-size: 14.5px;
    max-width: 46ch;
  }

  .rule {
    border: none;
    border-top: 1px solid var(--border-strong);
    margin: 28px 0 0;
  }

  /* --- due-date reminders --- */

  .reminders { display: none; margin: 20px 0 4px; }
  .reminder-group + .reminder-group { margin-top: 14px; }

  .reminder-heading {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
  }

  .group-overdue .reminder-heading { color: var(--pri-high); }
  .group-today .reminder-heading { color: var(--pri-med); }

  .reminder-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .reminder-chip {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    padding: 6px 12px;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
    cursor: pointer;
    border: 1px solid;
    transition: opacity 0.12s ease;
  }

  .reminder-chip:hover { opacity: 0.8; }

  .group-overdue .reminder-chip { border-color: var(--pri-high); background: var(--pri-high-soft); color: var(--pri-high); }
  .group-today .reminder-chip { border-color: var(--pri-med); background: var(--pri-med-soft); color: var(--pri-med); }

  @keyframes flash-bg {
    0% { background: var(--accent-soft); }
    100% { background: transparent; }
  }

  li.item.flash { animation: flash-bg 1.2s ease; border-radius: 6px; }

  /* --- add form --- */

  form.add-form { margin: 28px 0 4px; }

  .add-row {
    display: flex;
    gap: 10px;
  }

  .add-row input[type="text"] {
    flex: 1;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .add-row input[type="text"]::placeholder { color: var(--text-faint); }

  .add-row input[type="text"]:focus-visible {
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .add-row > button.primary {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    color: var(--accent-contrast);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 0 20px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .add-row > button.primary:hover { opacity: 0.88; }

  .add-options {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }

  .add-options .field-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .segmented {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    overflow: hidden;
  }

  .segmented button {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    border: none;
    border-left: 1px solid var(--border-strong);
    padding: 6px 12px;
    cursor: pointer;
  }

  .segmented button:first-child { border-left: none; }

  .segmented button[data-active="true"][data-level="low"] { background: var(--pri-low-soft); color: var(--pri-low); }
  .segmented button[data-active="true"][data-level="med"] { background: var(--pri-med-soft); color: var(--pri-med); }
  .segmented button[data-active="true"][data-level="high"] { background: var(--pri-high-soft); color: var(--pri-high); }

  .view-toggle { margin: 4px 0 20px; }
  .view-toggle button[data-active="true"] { background: var(--accent-soft); color: var(--accent); }

  input[type="date"] {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 10px;
    outline: none;
  }

  input[type="date"]:focus-visible {
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: var(--calendar-filter);
    cursor: pointer;
  }

  .add-row > button.primary:focus-visible,
  .icon-btn:focus-visible,
  .segmented button:focus-visible,
  .priority-pill:focus-visible,
  .reminder-chip:focus-visible,
  input[type="checkbox"]:focus-visible,
  input[type="date"]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  /* --- list --- */

  ul.list {
    list-style: none;
    margin: 24px 0 0;
    padding: 0;
    border-top: 1px solid var(--border);
  }

  li.item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--border);
  }

  .checkbox-wrap {
    position: relative;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 1px;
  }

  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    margin: 0;
    border: 1.5px solid var(--border-strong);
    border-radius: 5px;
    background: var(--surface);
    cursor: pointer;
    display: grid;
    place-content: center;
    transition: background 0.12s ease, border-color 0.12s ease;
  }

  input[type="checkbox"]:hover { border-color: var(--accent); }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }

  input[type="checkbox"]::after {
    content: "";
    width: 10px;
    height: 10px;
    transform: scale(0);
    transition: transform 0.12s ease;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    background: var(--accent-contrast);
  }

  input[type="checkbox"]:checked::after { transform: scale(1); }

  .item-main { flex: 1; min-width: 0; }

  .item-text {
    display: block;
    font-size: 15px;
    color: var(--text);
    word-wrap: break-word;
    cursor: text;
    outline: none;
  }

  .item-text:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 3px;
    border-radius: 3px;
  }

  li.done .item-text {
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--border-strong);
  }

  .item-controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 7px;
  }

  .priority-pill {
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    border-radius: 20px;
    padding: 3px 10px;
    cursor: pointer;
    background: transparent;
    border: 1px dashed var(--pri-none-border);
    color: var(--pri-none-text);
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }

  .priority-pill[data-level="low"] { border: 1px solid var(--pri-low); background: var(--pri-low-soft); color: var(--pri-low); }
  .priority-pill[data-level="med"] { border: 1px solid var(--pri-med); background: var(--pri-med-soft); color: var(--pri-med); }
  .priority-pill[data-level="high"] { border: 1px solid var(--pri-high); background: var(--pri-high-soft); color: var(--pri-high); }

  .due-input.urgency-overdue { color: var(--pri-high); border-color: var(--pri-high); }
  .due-input.urgency-today { color: var(--pri-med); border-color: var(--pri-med); }

  li.done .due-input,
  li.done .priority-pill { opacity: 0.55; }

  .icon-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: grid;
    place-content: center;
    background: transparent;
    border: none;
    border-radius: 5px;
    color: var(--text-faint);
    cursor: pointer;
    margin-left: auto;
    opacity: 0;
    transition: opacity 0.12s ease, color 0.12s ease, background 0.12s ease;
  }

  li.item:hover .icon-btn,
  li.item:focus-within .icon-btn { opacity: 1; }

  .icon-btn:hover { color: var(--danger); background: var(--danger-soft); }

  .empty-state {
    padding: 48px 4px;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
  }

  .empty-state .glyph {
    font-family: var(--font-display);
    font-size: 28px;
    color: var(--border-strong);
    margin-bottom: 10px;
    display: block;
  }

  footer.status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    padding-top: 4px;
  }

  .count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .count strong { color: var(--text); font-weight: 600; }

  .clear-btn {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 2px;
    text-decoration: underline;
    text-decoration-color: var(--border-strong);
    text-underline-offset: 3px;
  }

  .clear-btn:hover { color: var(--danger); text-decoration-color: var(--danger); }
  .clear-btn:disabled { color: var(--text-faint); text-decoration-color: transparent; cursor: default; }

  /* --- device sync --- */

  .sync-panel {
    margin: 20px 0 0;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }

  .sync-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border-strong);
    flex-shrink: 0;
  }

  .sync-dot.on { background: var(--accent); }

  .sync-label {
    font-size: 13px;
    color: var(--text-muted);
  }

  .sync-code-chip {
    font-family: var(--font-mono);
    font-size: 12.5px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 6px;
    padding: 3px 8px;
    letter-spacing: 0.02em;
  }

  .sync-link-btn {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px;
    text-decoration: underline;
    text-decoration-color: var(--border-strong);
    text-underline-offset: 3px;
  }

  .sync-link-btn:hover { text-decoration-color: var(--accent); }
  .sync-link-btn.danger:hover { color: var(--danger); text-decoration-color: var(--danger); }

  .sync-form-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .sync-form-row input[type="text"] {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 10px;
    outline: none;
  }

  .sync-form-row input[type="text"]:focus-visible {
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .sync-form-row button.primary-sm {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;

      return [];
    }

  var SYNC_CODE_KEY = "task-ledger.sync-code";
  var syncCode = null;
  try { syncCode = localStorage.getItem(SYNC_CODE_KEY) || null; } catch (e) {}

  var syncFormOpen = false;
  var suppressNextPush = false;

  function saveItems(items) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) { /* storage unavailable */ }

  function normalizeItems(arr) {
    arr.forEach(function (it) {
      if (!it.id) it.id = makeId();

      if (it.dueDate === undefined) it.dueDate = null;
      if (it.done === undefined) it.done = false;
      if (it.archived === undefined) it.archived = false;
      if (it.tag === undefined) it.tag = null;
      if (it.startDate === undefined) it.startDate = null;
      if (it.notes === undefined) it.notes = null;
      if (it.alarmAt === undefined) it.alarmAt = null;

  function toLocalDatetimeInputValue(d) {
    function pad(n) { return String(n).padStart(2, "0"); }

  }

  function formatAlarmLabel(iso) {
    var d = new Date(iso);

      d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function playAlarmSound() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      [0, 0.28].forEach(function (delay) {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.type = "sine";
        o.frequency.value = 880;
        var t0 = ctx.currentTime + delay;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
        o.start(t0);
        o.stop(t0 + 0.24);

  function saveFiredAlarms() {

  }

    alarmBannerTextEl.textContent = item.text;

    if (window.Notification && Notification.permission === "granted") {
      try { new Notification("Task Ledger alarm", { body: item.text }); } catch (e) {}
    }
  }

  function checkAlarms() {
    var now = Date.now();
    var changed = false;
    items.forEach(function (it) {
      if (it.archived || it.done || !it.alarmAt) return;
      if (new Date(it.alarmAt).getTime() > now) return;
      if (firedAlarms[it.id] === it.alarmAt) return;
      firedAlarms[it.id] = it.alarmAt;
      changed = true;
      alarmQueue.push(it);
    });
    if (changed) saveFiredAlarms();
    if (!alarmBannerEl.classList.contains("show") && alarmQueue.length > 0) showNextAlarm();
  }

  alarmBannerDismissBtn.addEventListener("click", function () {

  }

  function handleRemoteUpdate(remoteItems) {

  function rotateSync() {

    } else if (syncFormOpen) {
      html =
        '<div class="sync-row">' +
          '<span class="sync-dot"></span>' +
          '<span class="sync-label">Not synced &mdash; this device only</span>' +
        '</div>' +
        '<div class="sync-form-row">' +
          '<input type="text" id="sync-code-input" placeholder="Paste a sync code" maxlength="24" aria-label="Sync code">' +

  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function fmtDue(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function urgency(dateStr, done) {
    if (!dateStr || done) return "none";
    var today = todayStr();
    if (dateStr < today) return "overdue";
    if (dateStr === today) return "today";
    return "upcoming";
  }

  var PRIORITY_RANK = { high: 3, med: 2, low: 1 };

  function compareItems(a, b) {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1; // open tasks first
    if (a.dueDate !== b.dueDate) {
      if (!a.dueDate) return 1;   // undated sorts after dated
      if (!b.dueDate) return -1;
      return a.dueDate < b.dueDate ? -1 : 1; // soonest first
    }
    var ar = PRIORITY_RANK[a.priority] || 0;
    var br = PRIORITY_RANK[b.priority] || 0;
    return br - ar; // high priority first among same-due items
  }

  function setPickerState(level) {

  });

  function renderReminders() {
    var today = todayStr();
    var overdue = items.filter(function (it) { return !it.done && it.dueDate && it.dueDate < today; });
    var dueToday = items.filter(function (it) { return !it.done && it.dueDate === today; });

    if (overdue.length === 0 && dueToday.length === 0) {
      remindersEl.innerHTML = "";
      remindersEl.style.display = "none";
      return;
    }

    function chip(it) {
      return '<button type="button" class="reminder-chip" data-target="task-' + it.id + '">' + escapeHtml(it.text) + "</button>";
    }

    function group(cls, suffix, list) {
      if (list.length === 0) return "";
      var noun = list.length === 1 ? "task" : "tasks";
      return '<div class="reminder-group ' + cls + '"><p class="reminder-heading">' + list.length + " " + noun + " " + suffix +
        '</p><div class="reminder-items">' + list.map(chip).join("") + "</div></div>";
    }

    remindersEl.innerHTML = group("group-overdue", "overdue", overdue) + group("group-today", "due today", dueToday);
    remindersEl.style.display = "";

    remindersEl.querySelectorAll(".reminder-chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var target = document.getElementById(btn.getAttribute("data-target"));
        if (!target) return;
        var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });

      });
    });
  }

  function render() {
    renderReminders();
    renderArchivePanel();
    renderTagFilter();
    renderTimeline();
    listEl.innerHTML = "";

    var visible = items.filter(function (it) { return !it.archived; });
    if (activeTagFilter) {
      visible = visible.filter(function (it) { return it.tag === activeTagFilter; });
    }

    if (visible.length === 0) {
      var empty = document.createElement("li");

        ? '<span class="glyph">&#9634;</span>Nothing tagged &ldquo;' + escapeHtml(activeTagFilter) + '&rdquo;.'
        : '<span class="glyph">&#9634;</span>Nothing on the ledger yet.';

    } else {
      visible.slice().sort(compareItems).forEach(function (item) {

        var main = document.createElement("div");

        var text = document.createElement("span");

        pri.addEventListener("click", function () {

        due.addEventListener("change", function () {
          item.dueDate = due.value || null;
          saveItems(items);
          render();
        });

        var tagInput = document.createElement("input");
        tagInput.type = "text";
        tagInput.className = "tag-input";
        tagInput.placeholder = "+ tag";
        tagInput.maxLength = 24;
        tagInput.value = item.tag || "";
        tagInput.setAttribute("list", "tag-options");
        tagInput.setAttribute("aria-label", "Project tag");
        tagInput.addEventListener("change", function () {

        var del = document.createElement("button");
        del.type = "button";
        del.className = "icon-btn";

        del.innerHTML = "&#10005;";
        del.addEventListener("click", function () {

            saveItems(items);
            render();
          });
        });

        var notesBtn = document.createElement("button");
        notesBtn.type = "button";
        notesBtn.className = "notes-btn" + (item.notes ? " has-notes" : "");
        notesBtn.innerHTML = "&#9998;";
        notesBtn.setAttribute("aria-label", item.notes ? "Edit note" : "Add a note");

        var alarmBtn = document.createElement("button");
        alarmBtn.type = "button";
        alarmBtn.className = "alarm-pill" + (item.alarmAt ? " set" : "");
        alarmBtn.textContent = item.alarmAt ? formatAlarmLabel(item.alarmAt) : "+ alarm";
        alarmBtn.setAttribute("aria-label", item.alarmAt ? "Change alarm time" : "Set an alarm");
        var alarmExpanded = !!expandedAlarms[item.id];
        alarmBtn.setAttribute("aria-expanded", String(alarmExpanded));
        alarmBtn.addEventListener("click", function () {
          expandedAlarms[item.id] = !expandedAlarms[item.id];
          render();
        });

        controls.appendChild(pri);
        controls.appendChild(start);
        controls.appendChild(due);
        controls.appendChild(tagInput);
        controls.appendChild(notesBtn);
        controls.appendChild(alarmBtn);
        controls.appendChild(del);

        main.appendChild(text);
        main.appendChild(controls);

        if (isExpanded) {
          var notesInput = document.createElement("textarea");
          notesInput.className = "notes-input";
          notesInput.placeholder = "Why did you check this off (or not)? Any context for later…";
          notesInput.value = item.notes || "";
          notesInput.addEventListener("change", function () {
            item.notes = notesInput.value.trim() || null;
            saveItems(items);
            render();
          });
          main.appendChild(notesInput);
        }

        if (alarmExpanded) {

            render();

          main.appendChild(alarmInput);
        }

        li.appendChild(wrap);
        li.appendChild(main);
        listEl.appendChild(li);
      });
    }

    var remaining = visible.filter(function (it) { return !it.done; }).length;
    var doneCount = visible.length - remaining;
    countEl.innerHTML = visible.length === 0 ? "" : "<strong>" + remaining + "</strong> open &middot; " + doneCount + " done";
    clearBtn.disabled = doneCount === 0;
  }

  function restoreItem(item) {

    render();

  function renderArchivePanel() {
    var archived = items.filter(function (it) { return it.archived; });

    archivePanelEl.classList.toggle("open", archiveOpen);

      return;
    }

    var query = archiveSearchQuery.trim().toLowerCase();
    var filtered = !query ? archived : archived.filter(function (it) {
      return (it.text || "").toLowerCase().indexOf(query) !== -1 ||
        (it.notes || "").toLowerCase().indexOf(query) !== -1;
    });

    if (filtered.length === 0) {

      text.className = "archive-item-text";

      restoreBtn.className = "archive-restore-btn";

  archiveToggleBtn.addEventListener("click", function () {

  });

  viewToggleEl.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {

        b.setAttribute("data-active", b === btn ? "true" : "false");
      });
      listViewEl.hidden = currentView !== "list";
      timelineViewEl.hidden = currentView !== "timeline";
    });
  });

  function renderTimeline() {
    function toDate(s) {
      var p = s.split("-").map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }

    // start defaults to the day the task was created when no explicit Start
    // date is set, so every dated task gets a meaningful bar for free.
    function taskSpan(it) {
      var s = it.startDate ? toDate(it.startDate) : new Date(it.createdAt);
      s.setHours(0, 0, 0, 0);
      var e = it.dueDate ? toDate(it.dueDate) : new Date(s);
      if (s > e) s = new Date(e); // guard against a start that lands after its own due date
      return { start: s, end: e };
    }

    var dated = items.filter(function (it) {
      return !it.archived && (it.dueDate || it.startDate) && (!activeTagFilter || it.tag === activeTagFilter);
    });
    var unscheduled = items.filter(function (it) {
      return !it.archived && !it.dueDate && !it.startDate && (!activeTagFilter || it.tag === activeTagFilter);
    });

    if (dated.length === 0) {
      timelineViewEl.innerHTML = '<p class="timeline-empty">No dated tasks yet &mdash; set a due date (and optionally a start date) on a task to see it here.</p>';
      return;
    }

    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var minD = new Date(today), maxD = new Date(today);

    dated.forEach(function (it) {
      var span = taskSpan(it);
      if (span.start < minD) minD = new Date(span.start);
      if (span.end > maxD) maxD = new Date(span.end);
    });
    minD.setDate(minD.getDate() - 3);
    maxD.setDate(maxD.getDate() + 3);

    var MIN_DAYS = 21;
    var totalDays = Math.round((maxD - minD) / 86400000) + 1;
    if (totalDays < MIN_DAYS) {
      var pad = Math.ceil((MIN_DAYS - totalDays) / 2);
      minD.setDate(minD.getDate() - pad);
      maxD.setDate(maxD.getDate() + pad);
      totalDays = Math.round((maxD - minD) / 86400000) + 1;
    }

    function dayIndex(d) { return Math.round((d - minD) / 86400000); }

    var daysHtml = "";
    var bgHtml = "";
    for (var i = 0; i < totalDays; i++) {
      var d = new Date(minD);
      d.setDate(d.getDate() + i);
      var isWeekend = d.getDay() === 0 || d.getDay() === 6;
      var isToday = d.getTime() === today.getTime();
      daysHtml += '<div class="timeline-day-header' + (isWeekend ? " weekend" : "") + (isToday ? " is-today" : "") + '">' +
        d.getDate() + '<span class="dow">' + d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2) + '</span></div>';
      bgHtml += '<span' + (isWeekend ? ' class="weekend"' : "") + '></span>';
    }

    var todayOffset = dayIndex(today);
    var todayLineHtml = (todayOffset >= 0 && todayOffset < totalDays)
      ? '<div class="timeline-today-line" style="left:' + (todayOffset * DAY_WIDTH + DAY_WIDTH / 2) + 'px"></div>'
      : "";

    var rowsHtml = "";
    dated.slice().sort(compareItems).forEach(function (item) {
      var span = taskSpan(item);
      var startIdx = dayIndex(span.start);
      var endIdx = dayIndex(span.end);
      var barLeft = startIdx * DAY_WIDTH + 3;
      var barWidth = Math.max(22, (endIdx - startIdx + 1) * DAY_WIDTH - 6);
      var priClass = item.priority ? "pri-" + item.priority : "pri-none";
      var autoStart = !item.startDate ? ' title="Started ' + escapeHtml(span.start.toLocaleDateString()) + " (auto, from when this was added) → due " + escapeHtml(span.end.toLocaleDateString()) + '"' : "";
      rowsHtml +=
        '<div class="timeline-track-row">' +
          '<div class="timeline-name-cell' + (item.done ? " done" : "") + '">' + escapeHtml(item.text) + "</div>" +
          '<div class="timeline-days">' +
            '<div class="timeline-track-bg">' + bgHtml + "</div>" +
            todayLineHtml +
            '<div class="timeline-bar ' + priClass + (item.done ? " done" : "") +
              '" style="left:' + barLeft + "px;width:" + barWidth + 'px"' + autoStart + ">" +
              escapeHtml(item.text) +
            "</div>" +
          "</div>" +
        "</div>";
    });

    var html =
      '<div class="timeline-wrap"><div class="timeline-grid">' +
        '<div class="timeline-header-row">' +
          '<div class="timeline-name-header">Task</div>' +
          '<div class="timeline-days">' + daysHtml + "</div>" +
        "</div>" +
        rowsHtml +
      "</div></div>";

    if (unscheduled.length > 0) {
      html += '<div class="timeline-unscheduled"><p class="timeline-unscheduled-heading">No dates set</p>' +
        unscheduled.map(function (it) {
          return '<p class="timeline-unscheduled-item">' + escapeHtml(it.text) + "</p>";
        }).join("") +
        "</div>";
    }

    timelineViewEl.innerHTML = html;

    var wrap = timelineViewEl.querySelector(".timeline-wrap");
    if (wrap) wrap.scrollLeft = Math.max(0, (todayOffset - 2) * DAY_WIDTH);
  }

  function renderTagFilter() {
    var tags = [];
    items.forEach(function (it) {
      if (!it.archived && it.tag && tags.indexOf(it.tag) === -1) tags.push(it.tag);
    });
    tags.sort(function (a, b) { return a.localeCompare(b); });

    // keep the "add task" autocomplete list in sync with tags actually in use
    tagOptionsEl.innerHTML = tags.map(function (t) {
      return '<option value="' + escapeHtml(t) + '"></option>';
    }).join("");

    if (tags.length === 0) {
      tagFilterBarEl.classList.remove("show");
      tagFilterBarEl.innerHTML = "";
      if (activeTagFilter) activeTagFilter = null;
      return;
    }
    if (activeTagFilter && tags.indexOf(activeTagFilter) === -1) activeTagFilter = null;

    tagFilterBarEl.classList.add("show");
    var html = '<button type="button" class="tag-filter-pill" data-active="' + (activeTagFilter === null) + '" data-tag="">All</button>';
    tags.forEach(function (t) {
      html += '<button type="button" class="tag-filter-pill" data-active="' + (activeTagFilter === t) + '" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>';
    });
    tagFilterBarEl.innerHTML = html;

    tagFilterBarEl.querySelectorAll(".tag-filter-pill").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTagFilter = btn.getAttribute("data-tag") || null;
        render();
      });
    });
  }

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    var val = inputEl.value.replace(/\s+/g, " ").trim();
    if (val === "") return;
    items.push({
      id: makeId(),
      text: val,
      done: false,
      archived: false,
      createdAt: Date.now(),
      priority: pendingPriority,
      startDate: startEl.value || null,
      dueDate: dueEl.value || null,
      tag: tagEl.value.trim() || null
    });
    saveItems(items);
    inputEl.value = "";
    startEl.value = "";
    dueEl.value = "";
    tagEl.value = "";
    setPickerState(null);
    inputEl.focus();
    render();
  });

  clearBtn.addEventListener("click", function () {
    var justArchived = items.filter(function (it) { return !it.archived && it.done; });
    if (justArchived.length === 0) return;
    justArchived.forEach(function (it) { it.archived = true; });
    saveItems(items);
    render();
    var n = justArchived.length;
    showUndoToast(n + (n === 1 ? " task" : " tasks") + " archived", function () {
      justArchived.forEach(function (it) { it.archived = false; });
      saveItems(items);
      render();
    });
  });

  renderSyncPanel();

  function startSyncIfSaved() {
    if (syncCode && window.__sync) window.__sync.watch(syncCode, handleRemoteUpdate);
  }
  window.addEventListener("sync-ready", startSyncIfSaved);
  if (window.__sync) startSyncIfSaved(); // in case the module script already finished

  exportBtn.addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "task-ledger-backup-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  importBtn.addEventListener("click", function () { importFileEl.click(); });

  importFileEl.addEventListener("change", function () {
    var file = importFileEl.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var imported;
      try { imported = JSON.parse(reader.result); } catch (e) {
        alert("That file isn't valid JSON — couldn't import it.");
        importFileEl.value = "";
        return;
      }
      if (!Array.isArray(imported)) {
        alert("That file doesn't look like a Task Ledger backup.");
        importFileEl.value = "";
        return;
      }
      var existingIds = {};
      items.forEach(function (it) { existingIds[it.id] = true; });
      var addedItems = [];
      imported.forEach(function (it) {
        if (it && typeof it.text === "string" && it.id && !existingIds[it.id]) {
          items.push(it);
          existingIds[it.id] = true;
          addedItems.push(it);
        }
      });
      importFileEl.value = "";
      if (addedItems.length === 0) {
        alert("Nothing new to import — every task in that file is already here.");
        return;
      }
      items = normalizeItems(items);
      saveItems(items);
      render();
      var n = addedItems.length;
      showUndoToast(n + (n === 1 ? " task" : " tasks") + " imported", function () {
        items = items.filter(function (it) { return addedItems.indexOf(it) === -1; });
        saveItems(items);
        render();
      });
    };
    reader.readAsText(file);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "n" || e.metaKey || e.ctrlKey || e.altKey) return;
    var active = document.activeElement;
    var tag = active && active.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (active && active.isContentEditable)) return;
    e.preventDefault();
    inputEl.focus();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (e) { console.error("SW registration failed", e); });
    });
  }

  render();
})();
</script>
